[project]
name = "claude-history-mcp"
version = "0.1.0"
description = "MCP server for querying Claude Code session history"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.0",
    "dateparser>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
claude-history-mcp = "claude_history_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_history_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real ~/.claude data",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "vulture>=2.16",
]
