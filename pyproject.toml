[project]
name = "claude-history-mcp"
version = "0.1.0"
description = "MCP server for querying Claude Code session history"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.0",
    "dateparser>=1.0",
]

[project.scripts]
claude-history-mcp = "claude_history_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/claude_history_mcp"]
package-data = {"claude_history_mcp" = ["py.typed"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real ~/.claude data",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "anyio>=4.0",
    "ruff>=0.15.22",
    "vulture>=2.16",
    "mypy>=1.15",
    "docsig>=0.91.8",
    "docvet>=1.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint.per-file-ignores]
"src/claude_history_mcp/models.py" = ["N815"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
